      - key: REPORT_RETENTION_YEARS
        value: "6"
      - key: REPORT_RETENTION_CONCERNS_MINOR_YEARS
        value: "7"
      - key: CONTACT_ENQUIRY_EMAIL_RATE_LIMIT_MAX
        value: "3"
      - key: CONTACT_ENQUIRY_EMAIL_RATE_LIMIT_WINDOW_MS
        value: "3600000"
      # --- Error monitoring ---
      - key: SENTRY_DSN
        sync: false

  # =====================================================================================================
  # STATIC SITES: apps/web and apps/admin, per environment (build register B-179, B-088; Decision Log #409, #437, #450).
  # Three services per environment: the API above, the web app and the admin app, each on its own https origin under
  # soccernity.com (production: soccernity.com, admin.soccernity.com, api.soccernity.com; staging: staging.soccernity.com,
  # admin.staging.soccernity.com, api.staging.soccernity.com). `domains:` is deliberately NOT listed here: attaching domains,
  # DNS records and the Cloudflare proxy are founder steps at the launch gate (docs/deployment.md, static sites). Until then each
  # site is reachable only on its onrender.com address, where the host-only same-site refresh cookie will not work (B-249).
  # Field names checked against https://render.com/docs/blueprint-spec, /docs/redirects-rewrites and /docs/static-site-headers
  # (read 2026-11-14). NOT validated by an import: no Render account exists.
  # =====================================================================================================
  - type: web
    name: soccernity-web-staging
    runtime: static
    branch: staging
    # No `region` and no `plan`: Render documents both as unsupported for static sites (global CDN, no compute plan).
    # STAGING builds with the plain build: no pending-copy check, so staging can go up before counsel has cleared the tagged strings.
    buildCommand: npm install && npm run build --workspace=apps/web
    staticPublishPath: ./apps/web/dist
    envVars:
      # Read at BUILD time (Vite inlines VITE_*). Changing it means a rebuild (trigger a deploy). It is the same origin as the API's
      # own address and as `connect-src` in the headers below; a spec keeps the three equal.
      - key: VITE_API_BASE_URL
        value: https://api.staging.soccernity.com
    # Every path that is not a real file is the single-page app. Render serves a real file at a path before it applies a rule,
    # so /sw.js, /assets/* and the favicon are NOT rewritten (https://render.com/docs/redirects-rewrites).
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # Response headers (Decision Log #420, #422, #450; docs/security-headers-csp-audit-report.md). Render cannot interpolate
    # variables into this file, so the origins are written out. https://*.r2.cloudflarestorage.com stands for S3_ENDPOINT: its real host contains the
    # Cloudflare account id, which is only known once the R2 bucket exists (a founder step at the launch gate), so tighten that one to
    # the exact host then. The public bucket is served at https://media.soccernity.com (S3_PUBLIC_BASE_URL, B-265), which is what
    # img-src and media-src name (docs/deployment.md, static sites). These headers can move to the Cloudflare
    # proxy if B-251 is built; if both set a header, check the response for a duplicate.
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'none'; base-uri 'none'; object-src 'none'; form-action 'self'; frame-ancestors 'none'; script-src 'self' https://js.stripe.com https://*.js.stripe.com; style-src 'self'; img-src 'self' data: blob: https://media.soccernity.com; media-src 'self' https://media.soccernity.com; font-src 'self'; connect-src 'self' https://api.staging.soccernity.com https://*.r2.cloudflarestorage.com https://api.stripe.com; frame-src https://js.stripe.com https://*.js.stripe.com https://hooks.stripe.com; worker-src 'self'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=(), usb=()"
      # The push service worker (B-285): the browser must always re-check it. Served as a real file, never the rewrite above.
      - path: /sw.js
        name: Cache-Control
        value: no-cache

