      # its IP. See docs/deployment.md before setting.
      - key: TRUST_PROXY_HOPS
        sync: false
      # GEOLITE2_DB_PATH: leave blank (default /app/services/api/geoip/GeoLite2-Country.mmdb, owned by the container's non-root user;
