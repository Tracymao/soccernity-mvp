# Dependabot version updates. Decision Log #423, build-register B-250.
#
# PAUSED until the launch gate has passed (founder decision, 2026-10-29): both
# entries below have open-pull-requests-limit: 0, which GitHub documents as the
# way to temporarily disable version updates for a package manager. To
# re-enable, set both limits back to 5. Everything else in this file is kept as
# it was so that re-enabling is a one-line change per entry.
#
# This pause affects Dependabot VERSION updates only. It does not change
# GitHub's Dependabot alerts or Dependabot security updates (separate
# repository settings, with their own fixed limit), the dependency-audit gate
# in ci.yml, or the CodeQL workflow.
#
# Defaults here are founder-adopted and veto-able (see the 2026-10-29
# dependency policy entry):
#   - npm: weekly, one entry for the repo root (it covers every workspace).
#   - github-actions: monthly.
#   - minor and patch updates are grouped into one PR per ecosystem entry.
#   - at most 5 open PRs per entry once re-enabled (currently 0, see above).
#   - major-version bumps are ignored for the packages this project upgrades
#     deliberately (React, React Router, NestJS, Vite, Prisma, Expo, React
#     Native). Those moves have their own PRs and decisions (Decision Log
#     #24, #25, #27, #28; B-255), so a bot PR must not start one.
#
# One entry, "/" only. The first run showed Dependabot already walks every
# npm workspace from the root (PR #505 edited apps/web, apps/admin,
# apps/mobile and services/api in one go), so also listing each workspace
# opened every bump two or three times (#506/#514, #507/#513, #508/#510/
# #511, #509/#512). Use "/" alone.
#
# Security updates (founder decision, 2026-10-30): Dependabot SECURITY updates
# are wanted (the repository setting is switched on); only version updates are
# paused. Every ignore entry below therefore uses update-types, never a bare
# dependency-name entry. GitHub's docs: "update-types only affects version
# updates, not security updates. Security updates will always be created
# regardless of the update-types setting" (controlling-dependencies-updated),
# and the 2021-05-21 changelog says update-type ignores only apply to version
# updates. A vulnerability whose fix exists only in a major version that is on
# the hold list below therefore still gets a security PR (it may be a major bump
# or, for react and react-dom, fail npm install like PR #505 did). Review it by
# hand; nothing is merged automatically.
#
# Packages ignored on purpose after the first run (2026-10-29):
#   - react, react-dom (ALL updates): apps/mobile stays on React 18 because of
#     React Native; apps/web is on React 19 (Decision Log #27) and apps/admin
#     moved to React 19.2.8 and React Router 8 in B-255. A root-level run
#     tries to give every workspace one version;
#     PR #505 moved web and admin from react ^19.2.8 down to ^18.3.1, which
#     fails npm install with ERESOLVE. React moves only by hand.
#   - react-native (minor and major): 0.x, so 0.74 -> 0.88 is a "minor" to
#     Dependabot but is a breaking upgrade (#505 tried it).
#   - class-validator (minor and major): 0.x, 0.14 -> 0.15 is breaking.
#   - @vitejs/plugin-react (major): v6 needs vite ^8 and is ESM-only;
#     this repo is on vite 5 (PRs #508/#510/#511 failed CI on it).
#   - @stripe/stripe-js (major): @stripe/react-stripe-js 6.11 peers
#     stripe-js <10, and the react-stripe-js release that allows 10 needs
#     >=10. Move the two together, by hand.
#   - stripe (major): a major of the Stripe Node SDK changes the pinned
#     Stripe API version (the code sets no apiVersion), and the card
#     verification flow has never run against live Stripe.
#   - @sentry/* (major): founder decision, 2026-10-29. Sentry majors are
#     reviewed and taken by hand, not by bot PR (#506/#514 proposed 10 -> 11).
#   - eslint, vitest (major): founder decision, 2026-10-29. Both are dev
#     tooling whose majors change config and test behaviour across the repo;
#     taken by hand.

version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "react-router"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-router-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@nestjs/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "prisma"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@prisma/client"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      # react and react-dom: every update type is listed on purpose instead of
      # a bare entry. For version updates this is identical (all three types
      # ignored). A bare dependency-name entry is documented as also applying
      # to security updates ("ignore those dependencies when it opens pull
      # requests for version updates and security updates"), whereas GitHub says
      # update-types do not stop security updates. See the 2026-10-30 note
      # above the ignore list in the header comment.
      - dependency-name: "react"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "class-validator"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@stripe/stripe-js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "stripe"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@sentry/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 0
    groups:
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"
