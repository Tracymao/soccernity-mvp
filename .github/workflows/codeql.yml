name: CodeQL

# Static analysis for the whole monorepo. Decision Log #423, build-register
# B-250. Results land in the repository's Security > Code scanning tab; making
# the check required on main is a repository setting, not code (see CLAUDE.md).

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  schedule:
    # Weekly, Monday 03:17 UTC. Off the hour on purpose: GitHub Actions
    # schedules are delayed or dropped at the top of the hour under load.
    - cron: "17 3 * * 1"

# Least privilege at the workflow level; the job adds only what it needs.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      # Needed only to read workflow-run metadata on private repositories.
      actions: read
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
