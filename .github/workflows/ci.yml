name: CI

# See MVP Build Plan Section 5 for the CI/CD decision this implements,
# and Section 7 for the definition-of-done checks this should eventually
# gate on (test suite, performance budget).

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://soccernity:soccernity@localhost:5432/soccernity_test
      # One-line, additive deviation from this PR's own brief (which asked
      # for ci.yml to be left completely untouched) — flagged explicitly,
      # not silently done. prisma/schema.prisma's datasource block now
      # declares `directUrl` (Decision Log #26, Neon's pooled-vs-direct
      # connection split — see .env.example's own DIRECT_URL comment).
      # Confirmed by literally reproducing it locally: running
      # `npx prisma migrate deploy` with this exact env shape (DATABASE_URL
      # set, DIRECT_URL unset) fails with Prisma error P1012,
      # "Environment variable not found: DIRECT_URL" — which would have
      # broken this job's existing "Run database migrations" step on the
      # very next push without this line. No pooler sits in front of CI's
      # own ephemeral Postgres service container, so the same value as
      # DATABASE_URL above is correct here, identical to local dev's own
      # .env/.env.test pattern.
      DIRECT_URL: postgresql://soccernity:soccernity@localhost:5432/soccernity_test
      REDIS_URL: redis://localhost:6379
      # Required by JwtModule.registerAsync (auth-foundation.module.ts) —
      # no code-level default, unlike JWT_ACCESS_TTL_SECONDS/
      # JWT_REFRESH_TTL_DAYS/etc. Missing here caused PR #59's own first
      # CI run to fail ("Run e2e tests" step) with "secretOrPrivateKey
      # must have a value" the instant a real jwtService.sign() call ran
      # through a genuinely bootstrapped AppModule for the first time —
      # see services/api/test/README.md and .env.test.example for the
      # full explanation. Obviously-fake, test-only value: must never
      # match any real deployment secret.
      JWT_SECRET: ci-test-only-jwt-secret-do-not-use-in-any-real-environment
      # sprint-2/admin-console-account-entity — same requirement as
      # JWT_SECRET above (admin-auth-foundation.module.ts's own
      # JwtModule.registerAsync has no fallback), added proactively this
      # time rather than waiting for a first failing CI run to surface it.
      # Deliberately a different value from JWT_SECRET — that difference
      # is part of what admin-auth-isolation.e2e-spec.ts proves.
      ADMIN_JWT_SECRET: ci-test-only-admin-jwt-secret-do-not-use-in-any-real-environment
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: soccernity
          POSTGRES_PASSWORD: soccernity
          POSTGRES_DB: soccernity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22.22.0"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run database migrations
        working-directory: services/api
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Run e2e tests
        working-directory: services/api
        run: npm run test:e2e

      - name: Build
        run: npm run build
