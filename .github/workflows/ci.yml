name: CI

# See MVP Build Plan Section 5 for the CI/CD decision this implements,
# and Section 7 for the definition-of-done checks this should eventually
# gate on (test suite, performance budget).

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://soccernity:soccernity@localhost:5432/soccernity_test
      REDIS_URL: redis://localhost:6379
      # Required by JwtModule.registerAsync (auth-foundation.module.ts) —
      # no code-level default, unlike JWT_ACCESS_TTL_SECONDS/
      # JWT_REFRESH_TTL_DAYS/etc. Missing here caused PR #59's own first
      # CI run to fail ("Run e2e tests" step) with "secretOrPrivateKey
      # must have a value" the instant a real jwtService.sign() call ran
      # through a genuinely bootstrapped AppModule for the first time —
      # see services/api/test/README.md and .env.test.example for the
      # full explanation. Obviously-fake, test-only value: must never
      # match any real deployment secret.
      JWT_SECRET: ci-test-only-jwt-secret-do-not-use-in-any-real-environment
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: soccernity
          POSTGRES_PASSWORD: soccernity
          POSTGRES_DB: soccernity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run database migrations
        working-directory: services/api
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Run e2e tests
        working-directory: services/api
        run: npm run test:e2e

      - name: Build
        run: npm run build
