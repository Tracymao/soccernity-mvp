name: CI

# See MVP Build Plan Section 5 for the CI/CD decision this implements,
# and Section 7 for the definition-of-done checks this should eventually
# gate on (test suite, performance budget).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: soccernity
          POSTGRES_PASSWORD: soccernity
          POSTGRES_DB: soccernity_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test
        env:
          DATABASE_URL: postgresql://soccernity:soccernity@localhost:5432/soccernity_test
          REDIS_URL: redis://localhost:6379

      - name: Build
        run: npm run build
